[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "hazel"
readme = "README.md"
authors = []
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.12"
dependencies = [
    "arches==8.2.0a25",
    # RedisCache for deployed instances (package_settings in hazel-fluxcd);
    # Arches refuses a non-ratelimiting cache with DEBUG off (arches.E001)
    "redis>=5",
    # PostgreSQL-backed search; lets ELASTICSEARCH_ENABLED be False. Pulls in
    # arches-modular-reports and arches-resource-sets. Keep package.json pins
    # (arches_search etc.) at the matching release commits.
    "arches-search>=0.1.0a23",
]
version = "0.0.1"

[dependency-groups]
dev = [
    "black==26.3.1",
    "coverage",
    "django-silk==5.5.0",
    "livereload",
    "pre-commit==4.6.1",
    "sst",
]

[tool.setuptools]
packages = ["hazel"]
